name: Build App

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write key
        # Only attempts to write keys if the build is on the master branch and secrets are populated
        if: github.ref == 'refs/heads/master' && env.HAS_SECRET == 'true'
        env:
          HAS_SECRET: ${{ secrets.KEYSTORE != '' }}
        run: |
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
          echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
          echo KEYSTORE_FILE=../key.jks >> signing.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com"
          build-scan-terms-of-use-agree: "yes"

      - name: Build with Gradle
        id: buildWithGradle
        run: |
          # Accept Android SDK licenses automatically
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          
          # Inject performance configurations into gradle.properties
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          
          # Execute compilation
          ./gradlew :manager:assemble
          
          # Find the generated APK name or fall back cleanly if it's an unsigned/debug build
          RELEASE_PATH="manager/build/outputs/apk/release"
          if [ -d "$RELEASE_PATH" ] && [ "$(ls -A $RELEASE_PATH)" ]; then
            releaseName=$(ls manager/build/outputs/apk/release/shizuku*-v*-release.apk | awk -F '(/|-release.apk)' '{print $6}')
            echo "releaseName=$releaseName" >> $GITHUB_OUTPUT
          else
            echo "releaseName=shizuku-debug-build" >> $GITHUB_OUTPUT
          fi

      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildWithGradle.outputs.releaseName }}
          path: "manager/build/outputs"
          compression-level: 9

